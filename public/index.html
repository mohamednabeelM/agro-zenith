<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062010" />
    <meta name="description" content="Agro Zenith — AI-powered agricultural platform for Tamil Nadu farmers. Disease detection, market prices, government schemes and more." />

    <title>Agro Zenith 🌿</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Page-load splash screen */
      #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(145deg, #062010 0%, #0e3a1c 50%, #0a4020 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash-icon {
        font-size: 64px;
        margin-bottom: 16px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      #splash-title {
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
      }
      #splash-sub {
        color: rgba(255,255,255,0.45);
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        margin-bottom: 32px;
      }
      #splash-error {
        display: none;
        max-width: 360px;
        margin: 20px 24px 0;
        color: rgba(255,255,255,0.85);
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }
      #splash-error button {
        margin-top: 14px;
        padding: 9px 16px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 6px;
        background: rgba(255,255,255,0.12);
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      #splash-bar-wrap {
        width: 180px;
        height: 4px;
        background: rgba(255,255,255,0.12);
        border-radius: 4px;
        overflow: hidden;
      }
      #splash-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2e9b4e, #1a6b32);
        border-radius: 4px;
        animation: load 1.2s ease-out forwards;
      }
      @keyframes load {
        0%   { width: 0%;   }
        60%  { width: 75%;  }
        100% { width: 100%; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1);    }
        50%       { transform: scale(1.08); }
      }

      /* Base reset */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root      { height: 100%; }
      body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f0f5f2;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>

  <body>
    <!-- Splash screen (hidden once React mounts) -->
    <div id="splash">
      <div id="splash-icon">🌿</div>
      <div id="splash-title">Agro Zenith</div>
      <div id="splash-sub">Empowering Agriculture · Predicting Harvests</div>
      <div id="splash-bar-wrap">
        <div id="splash-bar"></div>
      </div>
      <div id="splash-error" role="alert">
        The app did not start. If you opened this HTML file directly, run the app with
        <strong> npm start</strong> or serve the production <strong>build</strong> folder.
        If the site is hosted, make sure its build files were deployed.
        <br />
        <button type="button" onclick="window.location.reload()">Reload page</button>
      </div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      window.setTimeout(function () {
        var root = document.getElementById("root");
        var splash = document.getElementById("splash");
        if (root && root.childElementCount === 0 && splash && !splash.classList.contains("hidden")) {
          document.getElementById("splash-sub").textContent = "Unable to load Agro Zenith";
          document.getElementById("splash-bar-wrap").style.display = "none";
          document.getElementById("splash-error").style.display = "block";
        }
      }, 8000);
    </script>
  </body>
</html>
